name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. Validate proto compiles cleanly ──────────────────────────────────────
  proto:
    name: Compile proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Compile difp.proto (syntax check)
        run: protoc --proto_path=proto proto/difp.proto --descriptor_set_out=/dev/null

  # ── 2. Build the Java server ─────────────────────────────────────────────────
  server:
    name: Build server
    runs-on: ubuntu-latest
    needs: proto
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create proto symlink for server
        run: |
          mkdir -p server/java/examples/src/main/proto
          ln -sf "$(pwd)/proto/difp.proto" server/java/examples/src/main/proto/difp.proto

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-server-${{ hashFiles('server/java/examples/**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x server/java/examples/gradlew

      - name: Build server
        working-directory: server/java/examples
        run: ./gradlew installDist --no-daemon

  # ── 3. Build the Android example ─────────────────────────────────────────────
  android:
    name: Build Android example
    runs-on: ubuntu-latest
    needs: proto
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create proto symlink for Android
        run: |
          mkdir -p examples/android/app/src/main/proto
          ln -sf "$(pwd)/proto/difp.proto" examples/android/app/src/main/proto/difp.proto

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('examples/android/**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x examples/android/gradlew

      - name: Build Android APK (debug)
        working-directory: examples/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: difp-android-debug
          path: examples/android/app/build/outputs/apk/debug/*.apk