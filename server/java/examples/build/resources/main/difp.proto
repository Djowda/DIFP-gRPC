syntax = "proto3";

// ============================================================
//  DIFP — Djowda Interconnected Food Protocol  ·  v0.4
//  gRPC Transport Profile  ·  Skull Implementation
//
//  Spec reference : https://djowda.com/difp/
//  License        : CC-BY 4.0
// ============================================================

package difp.v04;

option java_multiple_files  = true;
option java_package         = "com.djowda.difp";
option java_outer_classname = "DifpProto";

// ============================================================
//  §3  SPATIAL  ·  MinMax99 Grid
// ============================================================

message GeoPoint {
  double latitude  = 1;
  double longitude = 2;
}

// Request the server to compute the cell ID for a lat/lng pair.
message GeoCellRequest {
  GeoPoint location = 1;
}

message GeoCellResponse {
  int64  cell_id  = 1;
  int64  lobby_id = 2;    // §24 — Layer 1
  int32  local_x  = 3;    // local position within lobby
  int32  local_y  = 4;
}

// ============================================================
//  §2  ECOSYSTEM ACTORS  ·  Component Types
// ============================================================

// Canonical type codes (stored as string in proto for wire
// compatibility with the spec's "sp", "f", "fa", … scheme).
// This enum is used internally; wire format uses the string code.
enum ComponentType {
  COMPONENT_TYPE_UNKNOWN  = 0;
  SEED_PROVIDER           = 1;   // sp
  FARMER                  = 2;   // f
  FACTORY                 = 3;   // fa
  WHOLESALER              = 4;   // w
  STORE                   = 5;   // s
  RESTAURANT              = 6;   // r
  USER                    = 7;   // u
  TRANSPORT               = 8;   // t
  DELIVERY                = 9;   // d
  ADMIN                   = 10;  // a
}

// ============================================================
//  §5  PRESENCE & DISCOVERY
// ============================================================

enum PresenceStatus {
  STATUS_UNKNOWN = 0;
  OPEN           = 1;
  CLOSED         = 2;
  BUSY           = 3;
}

// §5.1 — PresenceRecord (flat, no nested objects per spec §5.2 note)
message PresenceRecord {
  string         did            = 1;   // difp://{cellId}/{typeCode}/{componentId}
  string         component_name = 2;
  string         phone_number   = 3;
  int64          cell_id        = 4;
  string         component_type = 5;   // type code: f, s, r, …
  string         avatar_id      = 6;
  PresenceStatus status         = 7;
  string         working_time   = 8;   // "HH:MM-HH:MM"
  int64          last_update    = 9;   // Unix ms
  string         user_id        = 10;
  bool           is_asking      = 11;
  bool           is_donating    = 12;
}

// ============================================================
//  §6 / §19-21  CATALOG  ·  PAD + Live Delta
// ============================================================

// §21.1 — only these 3 fields travel over the wire
message DeltaRecord {
  int32  id        = 1;   // references DifpPadItem.id on device
  bool   available = 2;
  double price     = 3;   // local currency units
}

message CatalogPayload {
  string               pad_version = 1;   // e.g. "pad_dz_s_v4"
  repeated DeltaRecord catalog     = 2;
}

// ============================================================
//  §7  TRADE PROTOCOL
// ============================================================

enum TradeType {
  TRADE_TYPE_UNKNOWN = 0;
  ORDER              = 1;   // o — purchase request
  ASK                = 2;   // a — demand signal
  DONATION           = 3;   // d — surplus at no cost
}

enum TradeStatus {
  TRADE_STATUS_UNKNOWN = 0;
  PENDING              = 1;   // p
  ACCEPTED             = 2;   // a
  PROCESSING           = 3;   // pr
  COMPLETED            = 4;   // c
  CANCELLED            = 5;   // x
  DENIED               = 6;   // dn
}

// For ORDER trades.  For ASK/DONATION the item map uses quantity=1, price=0.
message OrderLine {
  double quantity = 1;
  double price    = 2;
  string unit     = 3;   // kg | g | l | piece | … (§20.4)
}

message TradeContactInfo {
  string phone   = 1;
  string address = 2;
  string comment = 3;
}

// §7.2 — canonical TradeMessage
message TradeMessage {
  string trade_id     = 1;

  // Routing
  string sender_did   = 2;
  string sender_type  = 3;
  string sender_cell  = 4;
  string receiver_did = 5;
  string receiver_type = 6;
  string receiver_cell = 7;

  // Metadata
  TradeType   trade_type = 8;
  TradeStatus status     = 9;

  // Payload
  map<string, OrderLine> items     = 10;  // item_id → OrderLine
  double                 total     = 11;
  int32                  list_size = 12;

  // Timestamps
  int64 created_at   = 13;   // Unix ms
  int64 last_updated = 14;

  TradeContactInfo info        = 15;
  string           denial_cause = 16;
}

// ============================================================
//  §15  MESSAGE ENVELOPE  ·  Universal Wrapper
// ============================================================

enum SenderRole {
  ROLE_UNKNOWN = 0;
  CLIENT       = 1;
  NODE         = 2;
  SERVICE      = 3;
  DEVICE       = 4;
}

enum TargetType {
  TARGET_UNKNOWN = 0;
  CELL           = 1;   // geographic broadcast to a cell
  NODE_TARGET    = 2;   // direct node-to-node
  BROADCAST      = 3;   // network-wide (TTL-limited)
  DIRECT         = 4;   // to a specific DID
}

enum MessageMode {
  MODE_UNKNOWN = 0;
  EVENT        = 1;   // fire-and-forget
  REQUEST      = 2;   // expects response
  RESPONSE     = 3;   // reply — sets context.parent_id
}

message MessageSender {
  string     did        = 1;
  string     node       = 2;
  string     public_key = 3;   // Ed25519 — future signing
  SenderRole role       = 4;
}

message MessageTarget {
  TargetType type  = 1;
  string     value = 2;   // cell ID / node ID / DID / "*"
}

message MessageContext {
  string trace_id  = 1;
  string parent_id = 2;   // links RESPONSE to its REQUEST
}

// ============================================================
//  §16  PAYLOAD TYPES  ·  One per message type
// ============================================================

// --- §5 PRESENCE ---
message PresenceAnnouncePayload {
  PresenceRecord record  = 1;
  CatalogPayload catalog = 2;   // optional live delta
}

message PresenceUpdatePayload {
  string         did         = 1;
  PresenceStatus status      = 2;
  int64          last_update = 3;
}

message PresenceLeavePayload {
  string did       = 1;
  int64  timestamp = 2;
}

// --- §7 TRADE ---
message TradeAskPayload    { TradeMessage trade = 1; }
message TradeDonatePayload { TradeMessage trade = 1; }

message TradeOfferPayload {
  TradeMessage   trade   = 1;
  CatalogPayload catalog = 2;
}

enum TradeAction {
  TRADE_ACTION_UNKNOWN = 0;
  TRADE_ACCEPT         = 1;
  TRADE_REJECT         = 2;
  TRADE_COMPLETE       = 3;
  TRADE_CANCEL         = 4;
}

message TradeActionPayload {
  string      trade_id  = 1;
  TradeAction action    = 2;
  string      reason    = 3;   // denial cause
  int64       timestamp = 4;
}

// --- QUERY ---
message QueryCellPayload {
  int64  cell_id        = 1;
  int32  radius         = 2;   // §3.4 neighbor radius
  string component_type = 3;   // filter (empty = all types)
}

message QueryResourcePayload {
  string item_uid = 1;
  int64  cell_id  = 2;
  int32  radius   = 3;
}

message QueryResponsePayload {
  repeated PresenceRecord participants = 1;
  int64                   cell_id     = 2;
  int32                   total_count = 3;
}

// --- NODE ---
message NodeAnnouncePayload {
  string         node_id   = 1;
  string         endpoint  = 2;
  repeated int64 lobby_ids = 3;
  string         version   = 4;
}

message NodeSyncPayload {
  int64 cell_id         = 1;
  int64 since_timestamp = 2;
}

message NodePingPayload {
  string node_id  = 1;
  int64  sent_at  = 2;
}

message NodePongPayload {
  string node_id  = 1;
  int64  sent_at  = 2;
  int64  received_at = 3;
}

// --- §4 IDENTITY ---
message IdentityRegisterPayload {
  GeoPoint location       = 1;
  string   component_type = 2;   // type code
  string   component_name = 3;
  string   phone_number   = 4;
  string   public_key     = 5;   // Ed25519 — optional in skull
}

// --- §27 REGISTRY (v0.4) ---
message RegistryAnnouncePayload {
  string         node_endpoint = 1;
  repeated int64 lobbies       = 2;   // deduplicated lobby IDs
}

message RegistryQueryPayload {
  int64          lobby_id  = 1;           // single lookup
  repeated int64 lobby_ids = 2;           // batch lookup
}

message NodeList { repeated string nodes = 1; }

message RegistryResponsePayload {
  int64                  lobby_id      = 1;
  repeated string        nodes         = 2;
  map<string, NodeList>  batch_results = 3;   // lobbyId(str) → NodeList
}

// ============================================================
//  §15  DIFP ENVELOPE  ·  Every message uses this wrapper
// ============================================================

message DifpEnvelope {
  // Identity
  string  id      = 1;   // msg-{timestamp}-{random}
  string  type    = 2;   // "trade.ask" | "presence.announce" | …
  string  version = 3;   // "0.4"

  // Sender
  MessageSender from = 4;

  // Routing
  MessageTarget target = 5;
  MessageMode   mode   = 6;
  string        cell   = 7;   // sender's cell ID as string

  // Timing & replay protection
  string timestamp = 8;   // ISO 8601 UTC
  int32  ttl       = 9;   // seconds
  int64  nonce     = 10;  // monotonically increasing per DID

  // Integrity (§15.3 — canonical hashing, future)
  string hash      = 11;
  string signature = 12;

  // Tracing (optional)
  MessageContext context = 13;

  // Type-specific payload  (§16)
  oneof payload {
    // Presence
    PresenceAnnouncePayload presence_announce = 20;
    PresenceUpdatePayload   presence_update   = 21;
    PresenceLeavePayload    presence_leave    = 22;

    // Trade
    TradeAskPayload     trade_ask    = 30;
    TradeOfferPayload   trade_offer  = 31;
    TradeDonatePayload  trade_donate = 32;
    TradeActionPayload  trade_action = 33;

    // Query
    QueryCellPayload     query_cell     = 40;
    QueryResourcePayload query_resource = 41;
    QueryResponsePayload query_response = 42;

    // Node management
    NodeAnnouncePayload node_announce = 50;
    NodeSyncPayload     node_sync     = 51;
    NodePingPayload     node_ping     = 52;
    NodePongPayload     node_pong     = 53;

    // Registry (v0.4)
    RegistryAnnouncePayload registry_announce = 60;
    RegistryQueryPayload    registry_query    = 61;
    RegistryResponsePayload registry_response = 62;

    // Identity
    IdentityRegisterPayload identity_register = 70;
  }
}

// ============================================================
//  gRPC SERVICE DEFINITIONS
// ============================================================

// Supporting messages
message RegisterResponse {
  bool   success = 1;
  string did     = 2;   // assigned DID: difp://{cellId}/{type}/{id}
  string token   = 3;   // auth token (placeholder)
  string error   = 4;
}

message NodeInfoRequest {}

message NodeInfoResponse {
  string         protocol        = 1;
  string         version         = 2;
  string         node_id         = 3;
  repeated int64 coverage_lobbies = 4;
  string         contact         = 5;
  repeated string federates      = 6;
}

message AckResponse {
  bool   accepted = 1;
  string message  = 2;
}

message EmptyRequest {}

message RegistryPeersResponse {
  repeated string registries = 1;
}

// ============================================================
//  Service 1 — DifpNodeService
//  The main DIFP node.  Clients connect via bidirectional
//  stream (Connect) for real-time coordination.
//  Unary shortcuts for simple request/response flows.
// ============================================================
service DifpNodeService {

  // ── Main channel ──────────────────────────────────────────
  // Full-duplex: client sends DifpEnvelopes, server streams
  // back events, query responses, and broadcast messages.
  // All message types route through this single stream.
  rpc Connect(stream DifpEnvelope) returns (stream DifpEnvelope);

  // ── Identity (§4) ─────────────────────────────────────────
  // Register a new component.  Server computes cell ID from
  // GPS, assigns DID, issues token.  Placeholder DB in v0.skull.
  rpc RegisterComponent(IdentityRegisterPayload) returns (RegisterResponse);

  // ── Spatial (§3) ──────────────────────────────────────────
  // Stateless utility — compute cell + lobby IDs from lat/lng.
  rpc ComputeCell(GeoCellRequest) returns (GeoCellResponse);

  // ── Presence (§5) ─────────────────────────────────────────
  // Direct query for participants in a cell / radius.
  rpc QueryCell(QueryCellPayload) returns (QueryResponsePayload);

  // ── Node meta ─────────────────────────────────────────────
  // Returns the node's well-known info (§10.1).
  rpc GetNodeInfo(NodeInfoRequest) returns (NodeInfoResponse);
}

// ============================================================
//  Service 2 — DifpRegistryService
//  Implements the §25 Node Registry — maps lobby IDs to nodes.
//  Exposes the /.well-known/difp/registry/* contract over gRPC.
// ============================================================
service DifpRegistryService {

  // Node → Registry: declare lobby coverage (§27.1)
  rpc AnnounceLobbies(RegistryAnnouncePayload) returns (AckResponse);

  // Client/Node → Registry: who serves lobby X? (§27.2 / §25.3)
  rpc QueryLobby(RegistryQueryPayload) returns (RegistryResponsePayload);

  // Batch lobby lookup (§26.2)
  rpc QueryLobbiesBatch(RegistryQueryPayload) returns (RegistryResponsePayload);

  // Federation: known peer registries (§25.3)
  rpc GetRegistryPeers(EmptyRequest) returns (RegistryPeersResponse);
}
